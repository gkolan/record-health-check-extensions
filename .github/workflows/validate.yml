name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${RUNNER_TEMP}/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/actionlint.tar.gz" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color=false .github/workflows/*.yml
      - name: Validate package contracts and documentation links
        run: node scripts/validate-repository.mjs

  npm-gates:
    name: Source, contract, and coverage gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - rhc-actions
          - rhc-alerts
          - rhc-builder
          - rhc-change-monitor
          - rhc-integrations
          - rhc-logs
          - rhc-reports
          - rhc-run-manager
        include:
          - package: rhc-alerts
            npm_ci_flags: --ignore-scripts
            extra_scripts: generate:check format:check test:prepackage-lock validate:slds
          - package: rhc-change-monitor
            extra_scripts: test:adapter-generator
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check out minimum promoted core contract
        uses: actions/checkout@v6
        with:
          repository: gkolan/record-health-check
          ref: b839c4916315c5129812bbf401e3ea7e99c7a326
          path: _core-benchmark
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci ${{ matrix.npm_ci_flags }}
      - name: Run package-specific gates
        if: matrix.extra_scripts
        env:
          EXTRA_SCRIPTS: ${{ matrix.extra_scripts }}
        run: |
          for script in ${EXTRA_SCRIPTS}; do
            npm run "${script}"
          done
      - name: Enforce source, security, and least-privilege contracts
        run: npm run validate --if-present
      - name: Verify the pinned minimum-core contract
        run: npm run validate:core-contract --if-present -- --core-root ../../_core-benchmark
      - name: Validate metadata XML
        run: npm run validate:xml --if-present
      - name: Enforce LWC coverage thresholds
        run: npm run test:coverage
      - name: Audit development dependencies
        run: npm audit --audit-level=high

  analyzer:
    name: Code Analyzer gate (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rhc-actions
            analyzer: 5.14.0
            analyzer_args: --workspace packages/rhc-actions/force-app --target packages/rhc-actions/force-app --rule-selector Recommended --include-fixes --severity-threshold 3
          - package: rhc-agent-actions
            analyzer: 5.15.0
            analyzer_args: --workspace packages/rhc-agent-actions/force-app/main/default --config-file code-analyzer.yml --severity-threshold 5
            xml_check: true
          - package: rhc-alerts
            analyzer: 5.14.0
            analyzer_args: --workspace packages/rhc-alerts/force-app --target packages/rhc-alerts/force-app --rule-selector Recommended --include-fixes --severity-threshold 5
          - package: rhc-builder
            analyzer: 5.14.0
            analyzer_args: --workspace packages/rhc-builder --target packages/rhc-builder/force-app --rule-selector Recommended --severity-threshold 3
          - package: rhc-change-monitor
            analyzer: 5.15.0
            analyzer_args: --workspace packages/rhc-change-monitor/force-app/main/default --config-file code-analyzer.yml --severity-threshold 5
            metadata_check: metadata:generate -- --check
            xml_check: true
          - package: rhc-integrations
            analyzer: 5.15.0
            analyzer_args: --workspace packages/rhc-integrations --target packages/rhc-integrations/force-app --rule-selector Recommended --include-fixes --severity-threshold 3
            npm_ci: true
          - package: rhc-logs
            analyzer: 5.14.0
            analyzer_args: --workspace packages/rhc-logs/force-app --target packages/rhc-logs/force-app --rule-selector Recommended --include-fixes --severity-threshold 5
          - package: rhc-reports
            analyzer: 5.14.0
            analyzer_args: --workspace packages/rhc-reports/force-app --target packages/rhc-reports/force-app --rule-selector Recommended --include-fixes --severity-threshold 2
          - package: rhc-run-manager
            analyzer: 5.15.0
            analyzer_args: --workspace packages/rhc-run-manager/force-app --target packages/rhc-run-manager/force-app --rule-selector Recommended --include-fixes --severity-threshold 3
            metadata_check: metadata:check
            xml_check: true
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned Salesforce CLI and Code Analyzer
        env:
          ANALYZER_VERSION: ${{ matrix.analyzer }}
        run: |
          npm install --global @salesforce/cli@2.149.9
          echo y | sf plugins install "code-analyzer@${ANALYZER_VERSION}"
      - name: Record analyzer toolchain
        run: |
          sf --version
          sf plugins --core
      - name: Install locked dependencies
        if: matrix.npm_ci
        working-directory: packages/${{ matrix.package }}
        run: npm ci
      - name: Verify generated metadata is current
        if: matrix.metadata_check
        working-directory: packages/${{ matrix.package }}
        env:
          METADATA_CHECK: ${{ matrix.metadata_check }}
        run: |
          # shellcheck disable=SC2086 # intentional split: "metadata:generate -- --check"
          npm run ${METADATA_CHECK}
      - name: Validate metadata XML
        if: matrix.xml_check
        working-directory: packages/${{ matrix.package }}
        run: python3 -c "import pathlib,xml.etree.ElementTree as ET; [ET.parse(path) for path in pathlib.Path('force-app').rglob('*.xml')]"
      - name: Validate Salesforce source conversion
        working-directory: packages/${{ matrix.package }}
        run: sf project convert source --root-dir force-app --output-dir "${RUNNER_TEMP}/${{ matrix.package }}-mdapi"
      - name: Enforce the package Code Analyzer severity threshold
        env:
          ANALYZER_ARGS: ${{ matrix.analyzer_args }}
        run: |
          # shellcheck disable=SC2086 # ANALYZER_ARGS is a flag list
          sf code-analyzer run ${ANALYZER_ARGS} --output-file "${RUNNER_TEMP}/${{ matrix.package }}-code-analyzer.json"
      - name: Enforce complete SFGE security analysis
        if: matrix.package == 'rhc-integrations'
        working-directory: packages/rhc-integrations
        run: |
          set -o pipefail
          sf code-analyzer run --rule-selector 'all:Security:1' --rule-selector 'all:Security:2' --target force-app --include-fixes --severity-threshold 2 --output-file "${RUNNER_TEMP}/rhc-integrations-security-analyzer.json" 2>&1 | tee "${RUNNER_TEMP}/rhc-integrations-security-analyzer.log"
          npm run validate:analyzer-log -- "${RUNNER_TEMP}/rhc-integrations-security-analyzer.log" sfge
      - name: Bind analyzer evidence to the checked-out revision
        if: always() && matrix.package == 'rhc-integrations'
        working-directory: packages/rhc-integrations
        run: >-
          npm run capture:release-evidence --
          --output "${RUNNER_TEMP}/rhc-integrations-release-evidence.json"
          --core-ref b839c4916315c5129812bbf401e3ea7e99c7a326
          --artifact "${RUNNER_TEMP}/rhc-integrations-code-analyzer.json"
          --artifact "${RUNNER_TEMP}/rhc-integrations-security-analyzer.json"
          --artifact "${RUNNER_TEMP}/rhc-integrations-security-analyzer.log"
      - name: Upload analyzer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-code-analyzer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.package }}-code-analyzer.json
            ${{ runner.temp }}/${{ matrix.package }}-security-analyzer.json
            ${{ runner.temp }}/${{ matrix.package }}-security-analyzer.log
            ${{ runner.temp }}/${{ matrix.package }}-release-evidence.json
          if-no-files-found: error
          retention-days: 90
