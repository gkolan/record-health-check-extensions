<template>
    <lightning-card title="Restricted Diagnostic Log Review" icon-name="utility:search">
        <lightning-spinner if:true={loading} alternative-text="Loading diagnostic logs"></lightning-spinner>
        <div class="slds-p-around_medium">
            <div class="slds-box slds-theme_info slds-m-bottom_medium">
                Execution Source filtering is unavailable because canonical core Log contract 1.0
                does not publish a source field. Check and Check Set values are preserved exactly as
                developer names; namespace prefixes are never reconstructed or rewritten.
            </div>
            <div class="slds-grid slds-wrap slds-gutters">
                <lightning-input class="slds-col slds-size_1-of-4" type="datetime" name="occurredFrom"
                    label="Occurred From" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" type="datetime" name="occurredTo"
                    label="Occurred To" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="severity"
                    label="Severity" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="code"
                    label="Code" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="runId"
                    label="Run ID" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="checkSetDeveloperName"
                    label="Check Set Developer Name" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="checkDeveloperName"
                    label="Check Developer Name" onchange={handleFilter}></lightning-input>
                <lightning-input class="slds-col slds-size_1-of-4" name="recordId"
                    label="Record ID" onchange={handleFilter}></lightning-input>
            </div>
            <lightning-button class="slds-m-vertical_medium" variant="brand" label="Apply Filters"
                onclick={applyFilters}></lightning-button>
            <div if:true={errorMessage} class="slds-notify slds-notify_alert slds-alert_error error-message" role="alert">
                <span class="slds-assistive-text">Error</span>{errorMessage}
            </div>
            <p if:true={showEmptyState} class="empty-state">No retained logs match the current filters.</p>
            <lightning-datatable if:true={rows.length} key-field="Id" data={rows} columns={columns}
                hide-checkbox-column onrowaction={handleRowAction}>
            </lightning-datatable>
            <section if:true={selectedDetails} class="slds-box slds-m-top_medium" aria-label="Log details" data-region="details">
                <div class="slds-grid slds-grid_align-spread">
                    <h2 class="slds-text-heading_small">{selectedDetails.Name} · {selectedDetails.Code__c}</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close details"
                        onclick={closeDetails}></lightning-button-icon>
                </div>
                <dl class="slds-list_horizontal slds-wrap slds-m-vertical_small">
                    <dt class="slds-item_label">Event ID</dt><dd class="slds-item_detail">{selectedDetails.EventId__c}</dd>
                    <dt class="slds-item_label">Exception</dt><dd class="slds-item_detail">{selectedDetails.ExceptionType__c}</dd>
                    <dt class="slds-item_label">Running user</dt><dd class="slds-item_detail">{selectedDetails.RunningUserId__c}</dd>
                    <dt class="slds-item_label">Ingested at</dt><dd class="slds-item_detail"><lightning-formatted-date-time value={selectedDetails.IngestedAt__c}></lightning-formatted-date-time></dd>
                </dl>
                <template if:true={selectedDetails.hasMessage}>
                    <h3 class="slds-text-title_caps">Message</h3>
                    <pre class="slds-text-body_small slds-scrollable" data-field="message">{selectedDetails.Message__c}</pre>
                </template>
                <template if:true={selectedDetails.hasStructuredDetails}>
                    <h3 class="slds-text-title_caps slds-m-top_small">Structured details</h3>
                    <pre class="slds-text-body_small slds-scrollable" data-field="details">{selectedDetails.StructuredDetails__c}</pre>
                </template>
            </section>
            <div if:true={hasMore} class="slds-align_absolute-center slds-m-top_medium">
                <lightning-button label="Load More Logs" onclick={loadMore} disabled={loading}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
