<template>
  <lightning-card title="RHC Change Monitor" icon-name="standard:record_update">
    <lightning-button slot="actions" label="Refresh" onclick={refresh} disabled={loading}></lightning-button>
    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
      </template>
      <template lwc:if={principalWarning}>
        <div class="slds-notify slds-notify_alert slds-alert_warning slds-var-m-bottom_small" role="alert">{principalWarning}</div>
      </template>
      <template lwc:if={status}>
        <dl class="slds-list_horizontal slds-wrap slds-var-m-bottom_small">
          <dt class="slds-item_label">Pending claims</dt>
          <dd class="slds-item_detail">{status.pendingCount}</dd>
          <dt class="slds-item_label">Retryable failures</dt>
          <dd class="slds-item_detail">{status.retryableFailedCount}</dd>
          <dt class="slds-item_label">Dispatcher queued</dt>
          <dd class="slds-item_detail">{status.dispatcherQueued}</dd>
          <dt class="slds-item_label">You hold the core run permission</dt>
          <dd class="slds-item_detail">{status.currentUserCanRunCore}</dd>
        </dl>
        <h2 class="slds-text-heading_small slds-var-m-top_small">Outcomes, last 7 days</h2>
        <lightning-datatable key-field="outcome" data={status.lastSevenDays} columns={summaryColumns} hide-checkbox-column></lightning-datatable>
        <h2 class="slds-text-heading_small slds-var-m-top_medium">Policies</h2>
        <lightning-datatable key-field="Id" data={status.policies} columns={policyColumns} hide-checkbox-column></lightning-datatable>
        <h2 class="slds-text-heading_small slds-var-m-top_medium">Recent claims</h2>
        <lightning-datatable key-field="Id" data={status.recent} columns={recentColumns} hide-checkbox-column is-loading={loading}></lightning-datatable>
        <div class="slds-grid slds-gutters slds-var-m-top_medium slds-grid_vertical-align-end">
          <div class="slds-col slds-size_1-of-3">
            <lightning-button label="Retry failed claims" variant="brand" onclick={handleRetry} disabled={loading} data-action="retry"></lightning-button>
          </div>
          <div class="slds-col slds-size_1-of-3">
            <lightning-input type="number" label="Purge terminal claims older than (days)" min="1" max="3650" value={retentionDays} onchange={handleRetentionChange}></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-3">
            <lightning-button label="Purge" variant="destructive" onclick={handlePurge} disabled={loading} data-action="purge"></lightning-button>
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
